name: ci

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build the app
        run: ./scripts/buildprod.sh